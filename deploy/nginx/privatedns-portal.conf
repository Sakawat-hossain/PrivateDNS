# Nginx for the customer portal.
#
# A separate server block from the admin site, on a separate name. The portal
# is public; the admin dashboard should not be, and giving them one vhost makes
# that distinction easy to lose.

server {
    listen 80;
    server_name my.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name my.example.com;

    ssl_certificate     /etc/letsencrypt/live/my.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # This one matters more here than anywhere else in the stack.
        #
        # The portal binds whatever source address it observes. Without this
        # header every customer would be bound to nginx's loopback address
        # instead of their own, and the proxy tier would authorise nobody.
        # 127.0.0.1 must appear in the portal's trusted_proxies for it to be
        # believed.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # The service worker must be served from the site root for its scope to
    # cover the whole portal.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8081;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8081;
        expires 1h;
    }

    location = /health { proxy_pass http://127.0.0.1:8081; access_log off; }
}
