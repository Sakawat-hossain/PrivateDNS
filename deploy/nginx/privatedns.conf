# Nginx for the PrivateDNS web tier.
#
# This carries the dashboard and the API only.
#
# DNS (53), DoT (853) and the SNI proxy (443 on the proxy host) must NEVER be
# placed behind an HTTP reverse proxy. They do not speak HTTP, and Nginx cannot
# carry them. Run them on their own host or their own address.

server {
    listen 80;
    server_name admin.example.com;

    # ACME challenges continue to work over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS. Only enable once you are certain this name will always be HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # The API sets its own security headers; these cover the static dashboard.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    # Serving the dashboard from the same origin as the API is what keeps the
    # session cookie first-party and makes CORS unnecessary.
    location / {
        root /var/www/privatedns;
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Only meaningful if 127.0.0.1 is listed in trusted_proxies.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location = /openapi.json { proxy_pass http://127.0.0.1:8080; }
    location = /health       { proxy_pass http://127.0.0.1:8080; access_log off; }
    location = /ready        { proxy_pass http://127.0.0.1:8080; access_log off; }
}
